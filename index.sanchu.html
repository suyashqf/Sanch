<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex,nofollow"><meta name="referrer" content="no-referrer">
<meta name="theme-color" content="#ffd9e4"><title>For Sanchuuu 🌸</title>
<style>
:root{--bg1:#ffd3e0;--bg2:#fff1f0;--ink:#4a2438;--accent:#e0507a;--card:rgba(255,255,255,.8);box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);-webkit-text-size-adjust:100%}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg1:#3b1a2b;--bg2:#1f0e18;--ink:#ffe6ee;--card:rgba(70,35,52,.8)}}
:root[data-theme="dark"]{--bg1:#3b1a2b;--bg2:#1f0e18;--ink:#ffe6ee;--card:rgba(70,35,52,.8)}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
html,body{height:100%;margin:0}
body{font-family:-apple-system,BlinkMacSystemFont,"SF Pro Rounded","Segoe UI",system-ui,sans-serif;background:linear-gradient(160deg,var(--bg1),var(--bg2)) fixed;background-color:var(--bg2);color:var(--ink);overflow-x:hidden}
main{max-width:420px;margin:0 auto;padding:18px 18px 40px;text-align:center;position:relative;z-index:2}
.hero{display:block;margin:4px auto 12px;max-width:100%;max-height:40vh;width:auto;height:auto;border-radius:26px;box-shadow:0 14px 40px rgba(180,50,90,.3);transition:max-height .4s}
main.compact .hero{max-height:20vh}
h1{font:italic 700 clamp(30px,9vw,38px)/1.1 Georgia,"Times New Roman",serif;margin:6px 0}
h2{font:italic 700 24px/1.2 Georgia,serif;margin:6px 0 14px}
.sub{font-size:17px;line-height:1.4;opacity:.88;margin:8px 0 14px}
#hearts span{font-size:24px;margin:0 4px;opacity:.25;filter:grayscale(1);display:inline-block;transition:.3s}
#hearts span.on{opacity:1;filter:none;transform:scale(1.15)}
.btn{display:inline-block;font:700 18px/1 inherit;font-family:inherit;padding:16px 26px;border:0;border-radius:999px;color:#fff;text-decoration:none;background:linear-gradient(135deg,#ff7aa2,#e0507a);box-shadow:0 8px 22px rgba(224,80,122,.45);cursor:pointer;touch-action:manipulation;-webkit-tap-highlight-color:transparent;-webkit-user-select:none;user-select:none}
.btn.alt{background:linear-gradient(135deg,#9a5b7a,#6b3350);box-shadow:0 8px 22px rgba(107,51,80,.4)}
.btn.run{position:fixed;z-index:5;transition:left .38s cubic-bezier(.2,1.4,.4,1),top .38s cubic-bezier(.2,1.4,.4,1)}
.btn.pulse{animation:pu 1s ease-in-out infinite}
@keyframes pu{50%{transform:scale(1.08)}}
input,textarea{width:100%;box-sizing:border-box;font-family:inherit;font-size:18px;padding:14px 16px;border-radius:16px;border:2px solid #f4a6bd;background:var(--card);color:var(--ink);text-align:center;-webkit-appearance:none;appearance:none;outline:0;margin-bottom:10px}
input:focus,textarea:focus{border-color:var(--accent)}
textarea{height:84px;font-size:16px}
#lk{font-size:15px}
.row{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin:12px 0}
.big{font:700 32px/1.2 ui-monospace,Menlo,monospace;margin:16px 0;word-break:break-all}
.err{color:#d6335f;min-height:20px;font-size:14px;margin:4px 0 10px}
.fine{font-size:13px;opacity:.7;line-height:1.4}.fine a{color:inherit}
.hide{display:none!important}
.toast{position:fixed;left:50%;top:calc(env(safe-area-inset-top,0px) + 14px);transform:translate(-50%,-20px);max-width:88vw;box-sizing:border-box;padding:12px 18px;border-radius:18px;background:var(--card);-webkit-backdrop-filter:blur(12px);backdrop-filter:blur(12px);box-shadow:0 8px 24px rgba(0,0,0,.2);font-weight:600;font-size:15px;line-height:1.35;opacity:0;pointer-events:none;transition:.3s;z-index:9}
.toast.on{opacity:1;transform:translate(-50%,0)}
.p{position:fixed;top:-30px;width:14px;height:14px;border-radius:70% 0 70% 0;background:#ffb3c8;opacity:.8;z-index:1;pointer-events:none;animation:fall linear infinite}
@keyframes fall{to{transform:translate(var(--dx),110vh) rotate(540deg) scale(var(--s))}}
</style></head><body>

  let x,y,i=0;
  do{x=12+Math.random()*Math.max(0,vw-w-24);y=150+Math.random()*Math.max(0,vh-h-210);i++}while(i<15&&Math.hypot(x-last.x,y-last.y)<150);
  last={x,y};b.style.left=x+'px';b.style.top=y+'px';
}
b.addEventListener('pointerdown',e=>{if(tries<3){e.preventDefault();dodge()}});
b.addEventListener('click',e=>{
  if(tries<3){if(e.detail===0)dodge();return}
  if(!ready)return;
  hide('#intro');show('#form');$('#m').classList.add('compact');$('#num').focus();
});
const BASE='https://claude.ai/artifact/EDgGMRpbjQ9Ni37dLdLTvN';let cur='';
function link(n){const b=/claudeusercontent\.com$/.test(location.hostname)?BASE:location.href.split('#')[0];return b+'#n='+encodeURIComponent(btoa(n))}
function msg(){return 'Here you go 💌 '+$('#lk').value+'\nIf the number does not show, open the page, tap "I received a link" and paste this code: '+btoa(cur)}
function finish(n){
  cur=n;hide('#intro');hide('#form');show('#done');$('#m').classList.remove('compact');
  $('#lk').value=link(n);
}
$('#form').onsubmit=e=>{
  e.preventDefault();
  const v=$('#num').value.trim(),d=v.replace(/\D/g,'');
  if(!/^[+\d\s().-]+$/.test(v)||d.length<8||d.length>15){$('#err').textContent="Hmm, that doesn't look like a number 🙈";return}
  const n=(v[0]==='+'?'+':'')+d;
  $('#num').blur();finish(n);
};
async function copy(t,btn){
  let ok=false;
  try{await navigator.clipboard.writeText(t);ok=true}catch(_){}
  if(!ok){const x=document.createElement('textarea');x.value=t;x.style.cssText='position:fixed;top:0;opacity:0;font-size:16px';document.body.appendChild(x);x.focus();x.select();x.setSelectionRange(0,t.length);try{ok=document.execCommand('copy')}catch(_){}x.remove()}
  const o=btn.textContent;btn.textContent=ok?'Copied! 💗':'Hold the link to copy';setTimeout(()=>btn.textContent=o,2200);
}
$('#cp').onclick=()=>copy(msg(),$('#cp'));
$('#lk').onfocus=e=>e.target.select();
if(navigator.share){show('#sh');$('#sh').onclick=()=>navigator.share({title:'For you 💌',text:msg()}).catch(()=>{})}
function decode(s){
  const m=String(s).match(/#n=(\S+)/)||[0,String(s).trim()];
  try{const n=atob(decodeURIComponent(m[1]));return OK.test(n)?n:null}catch(_){return null}
}
function view(n){
  ['#intro','#form','#done','#dec','#key'].forEach(s=>s==='#key'?$(s).parentNode.classList.add('hide'):hide(s));
  show('#view');$('#vn').textContent=n;$('#call').href='tel:'+n;$('#cv').onclick=()=>copy(n,$('#cv'));
}
$('#key').onclick=e=>{e.preventDefault();show('#dec')};
$('#dk').onclick=()=>{const n=decode($('#code').value);if(n)view(n);else $('#derr').textContent='That link looks off 🤔'};
const n0=decode(location.hash);
if(n0)view(n0);

if(!matchMedia('(prefers-reduced-motion:reduce)').matches){
  for(let i=0;i<16;i++){const d=document.createElement('i');d.className='p';d.style.cssText=`left:${Math.random()*100}vw;animation-duration:${8+Math.random()*8}s;animation-delay:${-Math.random()*12}s;--s:${.6+Math.random()*.8};--dx:${Math.random()*80-40}px`;document.body.appendChild(d)}
}
})();
